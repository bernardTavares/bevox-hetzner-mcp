name: bridge-image

# Builds and publishes the MCP stdio bridge image (core/Dockerfile.bridge)
# to GitHub Container Registry on version tags, or on manual dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bernardtavares/bevox-hetzner-mcp-bridge

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
          # Override labels the action derives from repo metadata.
          labels: |
            org.opencontainers.image.licenses=FSL-1.1-MIT
            org.opencontainers.image.description=MCP stdio bridge to a self-hosted bevox-hetzner-mcp daemon

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile.bridge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
