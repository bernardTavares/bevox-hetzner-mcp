# Dedicated Cloudflare Tunnel for the bevox-hetzner-mcp daemon.
# Served by deploy/systemd/cloudflared-bevox-hetzner-mcp.service.
tunnel: <TUNNEL_UUID>
credentials-file: /etc/bevox-hetzner-mcp/cloudflared/<TUNNEL_UUID>.json
ingress:
  - hostname: mcp.example.com
    service: http://127.0.0.1:8787
  - service: http_status:404
